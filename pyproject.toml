[project]
name = "lfx-liam-bundle"
version = "0.2.0"
description = "Liam GraphRAG 知识库建库与检索组件（AstraDB / ArangoDB）。"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [{ name = "Liam" }]
keywords = ["langflow", "lfx", "extension", "bundle", "liam"]
dependencies = [
    # 运行时由 Langflow 环境提供 lfx；此处声明兼容范围，便于本地开发解析。
    "lfx>=1.11.0,<2.0.0",
    "langchain-astradb~=1.0.0",
    "astrapy>=2.1.0,<3.0.0",
    "langchain-graph-retriever==0.8.0",
    "graph-retriever==0.8.0",
    "python-arango>=8.0.0,<9.0.0",
    "langchain-core>=0.3.0",
]

[project.urls]
Documentation = "https://docs.langflow.org/extensions-quickstart"

[project.entry-points."langflow.extensions"]
lfx-liam-bundle = "lfx_liam_bundle"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lfx_liam_bundle"]
include = [
    "src/lfx_liam_bundle/extension.json",
    "src/lfx_liam_bundle/components/**/*.py",
    "src/lfx_liam_bundle/graphrag/**/*.py",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/lfx_liam_bundle",
    "extension.json",
    "README.md",
    "pyproject.toml",
    "tests",
]

[tool.uv]
# 本地开发优先用旁边 langflow 仓库里的 lfx 源码，版本与现网 docker 一致。
package = true

[tool.uv.sources]
lfx = { path = "../langflow/src/lfx", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "build>=1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.langflow.extension]
manifest = "extension.json"
