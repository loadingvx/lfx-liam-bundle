[project]
name = "lfx-liam-bundle"
version = "0.0.3"
description = "Liam's personal Langflow extension toolkit (liam bundle). Currently ships GraphRAG components; more tools can be added under the same package."
readme = "README.md"
# Align with lfx; local mise and PyPI builds use 3.10 as the baseline.
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [{ name = "Liam" }]
maintainers = [{ name = "Liam" }]
keywords = [
    "langflow",
    "lfx",
    "extension",
    "bundle",
    "toolkit",
    "liam",
    "components",
    "graphrag",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    # Runtime lfx comes from the Langflow environment; declare a compatible range for local resolution.
    "lfx>=1.11.0,<2.0.0",
    "astrapy>=2.1.0,<3.0.0",
    "python-arango>=8.0.0,<9.0.0",
    "langchain-core>=0.3.0",
    "networkx>=3.2",
    "leidenalg>=0.10",
    "igraph>=0.11",
    "tiktoken>=0.7",
]

[project.urls]
Homepage = "https://github.com/loadingvx/lfx-liam-bundle"
Documentation = "https://github.com/loadingvx/lfx-liam-bundle#readme"
Repository = "https://github.com/loadingvx/lfx-liam-bundle"
Issues = "https://github.com/loadingvx/lfx-liam-bundle/issues"
Changelog = "https://github.com/loadingvx/lfx-liam-bundle/blob/main/CHANGELOG.md"
"Langflow Extensions" = "https://docs.langflow.org/extensions-quickstart"

[project.entry-points."langflow.extensions"]
lfx-liam-bundle = "lfx_liam_bundle"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lfx_liam_bundle"]
include = [
    "src/lfx_liam_bundle/extension.json",
    "src/lfx_liam_bundle/components/**/*.py",
    "src/lfx_liam_bundle/graphrag/**/*.py",
    "src/lfx_liam_bundle/py.typed",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/lfx_liam_bundle",
    "extension.json",
    "README.md",
    "README.zh-CN.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
    "tests",
    "docs",
]

[tool.uv]
# Prefer sibling langflow repo lfx for local development (match docker runtime).
package = true
# Align with mise.toml / .python-version / PyPI: baseline Python 3.10.
python-preference = "managed"

[tool.uv.sources]
lfx = { path = "../langflow/src/lfx", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "build>=1.2.0",
    "ruff>=0.9.0",
    "pre-commit>=4.0.0",
    "langchain-openai>=1.4.2",
    "openai>=2.53.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# Skip real-DB integration by default; use ./devops/test-integration.sh
addopts = ["-q", "--strict-markers", "-m", "not integration"]
markers = [
    "integration: real database integration tests (need ./devops/db-up.sh or cloud credentials)",
    "arango: ArangoDB integration tests",
    "astra: Astra cloud or local Data API (HCD) integration tests",
]

[tool.coverage.run]
source = ["lfx_liam_bundle"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # Long help strings in components are intentional
    "RUF001", # Fullwidth punctuation in strings (legacy / bilingual samples)
    "RUF002", # Fullwidth punctuation in docstrings
    "RUF003", # Fullwidth punctuation in comments
    "RUF012", # Langflow Component inputs/outputs commonly use mutable class defaults
    "SIM105", # try/except/pass cleanup in storage adapters is acceptable
]

[tool.ruff.lint.isort]
known-first-party = ["lfx_liam_bundle"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.langflow.extension]
manifest = "extension.json"
