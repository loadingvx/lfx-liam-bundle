[project]
name = "lfx-liam-bundle"
version = "0.0.1"
description = "Liam 完整 GraphRAG：实体关系抽取、Gleaning、分层社区、Local/Global Search（AstraDB / ArangoDB）。"
readme = "README.md"
# 与 lfx 一致；本地 mise / PyPI 构建均以 3.10 为基准
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [{ name = "Liam" }]
maintainers = [{ name = "Liam" }]
keywords = [
    "langflow",
    "lfx",
    "extension",
    "bundle",
    "liam",
    "graphrag",
    "knowledge-graph",
    "astradb",
    "arangodb",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    # 运行时由 Langflow 环境提供 lfx；此处声明兼容范围，便于本地开发解析。
    "lfx>=1.11.0,<2.0.0",
    "astrapy>=2.1.0,<3.0.0",
    "python-arango>=8.0.0,<9.0.0",
    "langchain-core>=0.3.0",
    "networkx>=3.2",
    "leidenalg>=0.10",
    "igraph>=0.11",
    "tiktoken>=0.7",
]

[project.urls]
Homepage = "https://github.com/loadingvx/lfx-liam-bundle"
Documentation = "https://github.com/loadingvx/lfx-liam-bundle#readme"
Repository = "https://github.com/loadingvx/lfx-liam-bundle"
Issues = "https://github.com/loadingvx/lfx-liam-bundle/issues"
Changelog = "https://github.com/loadingvx/lfx-liam-bundle/blob/main/CHANGELOG.md"
"Langflow Extensions" = "https://docs.langflow.org/extensions-quickstart"

[project.entry-points."langflow.extensions"]
lfx-liam-bundle = "lfx_liam_bundle"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lfx_liam_bundle"]
include = [
    "src/lfx_liam_bundle/extension.json",
    "src/lfx_liam_bundle/components/**/*.py",
    "src/lfx_liam_bundle/graphrag/**/*.py",
    "src/lfx_liam_bundle/py.typed",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/lfx_liam_bundle",
    "extension.json",
    "README.md",
    "README.zh-CN.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
    "tests",
    "docs",
]

[tool.uv]
# 本地开发优先用旁边 langflow 仓库里的 lfx 源码，版本与现网 docker 一致。
package = true
# 与 mise.toml / .python-version / PyPI 构建一致：最低即开发基准 3.10
python-preference = "managed"

[tool.uv.sources]
lfx = { path = "../langflow/src/lfx", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "build>=1.2.0",
    "ruff>=0.9.0",
    "pre-commit>=4.0.0",
    "langchain-openai>=1.4.2",
    "openai>=2.53.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# 默认不跑真库集成测试；用 ./devops/test-integration.sh
addopts = ["-q", "--strict-markers", "-m", "not integration"]
markers = [
    "integration: 真实数据库集成测试（需 ./devops/db-up.sh 或云凭证）",
    "arango: 针对 ArangoDB 的集成测试",
    "astra: 针对 Astra 云或本地 Data API(HCD) 的集成测试",
]

[tool.coverage.run]
source = ["lfx_liam_bundle"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # 组件中文文案较长，由阅读性优先
    "RUF001", # 中文全角标点（字符串）属预期
    "RUF002", # 中文全角标点（docstring）属预期
    "RUF003", # 中文全角标点（注释）属预期
    "RUF012", # Langflow Component 的 inputs/outputs 类属性惯用可变默认
    "SIM105", # 存储适配器中 try/except/pass 清理失败可接受
]

[tool.ruff.lint.isort]
known-first-party = ["lfx_liam_bundle"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.langflow.extension]
manifest = "extension.json"
