name: Feature request
description: Propose a new capability or UX improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who is stuck, and in which scenario?
      placeholder: e.g. Clearing a collection lacks a second confirmation; easy to wipe data by mistake…
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: How you want to use it; alternatives welcome.
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Primary backend relevance
      options:
        - AstraDB
        - ArangoDB
        - Both / general
        - Backend-agnostic (docs / tooling / CI)
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Extra context
      description: Screenshots, flow shape, related issues (please redact secrets)
