name: Bug report
description: Report unexpected behavior or a functional defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. **Do not** paste real tokens, passwords, or production connection strings.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the observed behavior and what you expected.
      placeholder: e.g. Indexing reports success, but retrieve always returns an empty list…
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Be as specific as possible (redact secrets in component config).
      placeholder: |
        1. Select the ArangoDB backend…
        2. Run GraphRAG Index Builder…
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: 0.0.3 (pip show lfx-liam-bundle)
    validations:
      required: true
  - type: input
    id: langflow-version
    attributes:
      label: Langflow / lfx version
      placeholder: langflow 1.11.x / lfx 1.11.x
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Knowledge-base backend
      options:
        - AstraDB
        - ArangoDB
        - Both / unsure
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error message / logs (redacted)
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I redacted all secrets and private network addresses
          required: true
        - label: I confirmed the extension is loaded (`lfx extension list` or UI)
          required: false
