# Build and upload to PyPI after a GitHub Release is published
# (Trusted Publishing / OIDC; no API token required).
# Docs: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries
#
# One-time setup:
# 1. GitHub repo Settings → Environments → create `pypi` (optional required reviewers)
# 2. PyPI → Account settings → Publishing → Add a new pending publisher:
#      - PyPI Project Name: lfx-liam-bundle
#      - Owner: loadingvx
#      - Repository: lfx-liam-bundle
#      - Workflow name: python-publish.yml
#      - Environment name: pypi
# 3. Before release, bump the three handwritten versions (must match the tag; tag may be v0.0.3 or 0.0.3):
#      ./scripts/bump-version.sh 0.0.3
#      i.e. pyproject.toml + root/package extension.json
#      (__version__ is derived from package metadata; do not hardcode)
# 4. Build uses Python 3.10 (matches requires-python minimum)

name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Verify version matches release tag
        run: |
          set -euo pipefail
          chmod +x scripts/check-versions.sh
          ./scripts/check-versions.sh "${GITHUB_REF_NAME}"

      - name: Verify requires-python allows 3.10
        run: |
          set -euo pipefail
          REQ="$(sed -nE 's/^requires-python[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' pyproject.toml | head -n1)"
          echo "requires-python: ${REQ}"
          # Minimum must be 3.10 (aligned with lfx / local mise)
          if [[ "${REQ}" != ">=3.10,"* && "${REQ}" != ">=3.10" && "${REQ}" != "~=3.10" ]]; then
            echo "::error::requires-python must allow 3.10 as the minimum; got: ${REQ}"
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          # Build on the minimum supported version to avoid accidental higher-only syntax/deps
          python-version: "3.10"

      - name: Build release distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -lah dist/
          python -c "import sys; assert sys.version_info[:2] == (3, 10), sys.version"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      # Required for Trusted Publishing (OIDC)
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/lfx-liam-bundle

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
          print-hash: true
